<body>
<main class="er">
  <a class="er-logo" href="../index.html" aria-label="POP"><img src="../img/logo-word.png" alt="POP" width="110" height="33"></a>
  <section class="er-card" aria-live="polite">
    <span class="er-icon" id="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg>
    </span>
    <p class="er-code" translate="no">POP LINK</p>
    <h1 id="title">هذا الرابط غير موجود</h1>
    <p id="text">ربما كُتب الرابط بشكل خاطئ، أو حذفه صاحبه.</p>
    <form class="go-form" id="form" hidden novalidate>
      <label class="field"><span>كلمة السر</span><input id="pass" type="password" maxlength="64" autocomplete="off" required></label>
      <button class="btn" id="open" type="submit">فتح الرابط</button>
      <p class="hint" id="msg" role="status" aria-live="polite"></p>
    </form>
    <div class="er-actions" id="actions">
      <a class="btn ghost" href="../index.html">تعرّف على POP</a>
    </div>
  </section>
  <p class="er-foot"><span>© <span id="yr" translate="no">2026</span> POP</span><span class="made-by">برمجة وتصميم <a href="https://crstudio911.github.io/MC/" target="_blank" rel="noopener noreferrer" translate="no">MC</a></span></p>
